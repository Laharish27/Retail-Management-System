<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InventoryPro | Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="main-content fade-in">
        <div class="page-header">
            <h1 class="page-title">Dashboard</h1>
        </div>
        
        <div class="dashboard-grid">
            <div class="stat-card">
                <h3><i class="fa-solid fa-box" style="color: var(--accent);"></i> Total Products</h3>
                <div class="value" id="stat-products">0</div>
            </div>
            <div class="stat-card" style="border-top: 3px solid var(--danger);">
                <h3><i class="fa-solid fa-triangle-exclamation" style="color: var(--danger);"></i> Low Stock</h3>
                <div class="value" id="stat-low-stock">0</div>
            </div>
            <div class="stat-card">
                <h3><i class="fa-solid fa-users" style="color: var(--text-secondary);"></i> Employees</h3>
                <div class="value" id="stat-employees">0</div>
            </div>
            <div class="stat-card" style="border-top: 3px solid var(--success);">
                <h3><i class="fa-solid fa-indian-rupee-sign" style="color: var(--success);"></i> Revenue</h3>
                <div class="value" id="stat-revenue">₹0</div>
            </div>
        </div>

        <div class="table-container">
            <h2 style="margin-bottom: 16px; font-size: 16px; font-weight: 600; color: var(--text-primary);">Recent Inventory Logs</h2>
            <table>
                <thead>
                    <tr>
                        <th>Log ID</th>
                        <th>Product</th>
                        <th>Employee</th>
                        <th>Change</th>
                        <th>Type</th>
                    </tr>
                </thead>
                <tbody id="logs-table-body">
                    <!-- Logs populated here -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        async function loadDashboardData() {
            try {
                const stats = await api.getDashboardStats();
                document.getElementById('stat-products').innerText = stats.products;
                document.getElementById('stat-low-stock').innerText = stats.lowStock;
                document.getElementById('stat-employees').innerText = stats.employees;
                document.getElementById('stat-revenue').innerText = '₹' + parseFloat(stats.revenue).toFixed(2);

                const logs = await api.getInventoryLogs();
                const tbody = document.getElementById('logs-table-body');
                tbody.innerHTML = '';
                
                logs.slice(0, 5).forEach(log => {
                    const row = `
                        <tr>
                            <td>#${log.Log_ID}</td>
                            <td>${log.Product_Name || 'N/A'}</td>
                            <td>${log.Employee_Name || 'N/A'}</td>
                            <td style="color: ${log.Quantity_Adjusted > 0 ? 'var(--success)' : 'var(--danger)'}; font-weight: 500;">
                                ${log.Quantity_Adjusted > 0 ? '+' : ''}${log.Quantity_Adjusted}
                            </td>
                            <td><span class="badge badge-in-stock">${log.Change_Type}</span></td>
                        </tr>
                    `;
                    tbody.insertAdjacentHTML('beforeend', row);
                });
            } catch (err) {
                console.error("Failed to load dashboard data", err);
            }
        }
        
        document.addEventListener('DOMContentLoaded', loadDashboardData);
    </script>
</body>
</html>
