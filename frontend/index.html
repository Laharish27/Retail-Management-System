<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InventoryPro | Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div style="margin-bottom: 8px;">
                <i class="fa-solid fa-layer-group" style="font-size: 32px; color: var(--accent);"></i>
            </div>
            <h2>Sign in</h2>
            <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 24px;">to continue to InventoryPro</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required placeholder="Enter your username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn"><i class="fa-solid fa-right-to-bracket"></i> Sign In</button>
            </form>
            <p id="error-msg" style="color: var(--danger); margin-top: 16px; font-size: 13px; display: none;"></p>
        </div>
    </div>

    <script src="js/api.js?v=2"></script>
    <script src="js/app.js?v=2"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            
            try {
                const res = await api.login(username, password);
                if (res.success) {
                    localStorage.setItem('user', JSON.stringify(res.user));
                    window.location.href = (res.user.role === 'Cashier' || res.user.Role === 'Cashier') ? 'cart.html' : 'dashboard.html';
                } else {
                    errorMsg.innerText = res.message || 'Login failed';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.innerText = 'Server connection error';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
